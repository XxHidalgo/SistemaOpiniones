<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 690" width="1180" height="690" font-family="Segoe UI, Calibri, Arial, sans-serif">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a6f8f"/>
    </marker>
    <marker id="flechaTenue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8fa5b8"/>
    </marker>
  </defs>

  <rect width="1180" height="690" fill="#ffffff"/>

  <text x="590" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#2c5f8a">Arquitectura del proceso de extracción</text>
  <text x="590" y="55" text-anchor="middle" font-size="13" fill="#666">Sistema de Análisis de Opiniones de Clientes — Worker Service .NET 8</text>

  <!-- ══════════ Grupo: Fuentes de datos ══════════ -->
  <rect x="20" y="80" width="215" height="360" rx="8" fill="#f7fafc" stroke="#b8c7d4" stroke-dasharray="5 3"/>
  <text x="127" y="102" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5f8a">Fuentes de datos</text>

  <rect x="40" y="118" width="175" height="76" rx="6" fill="#e8f0f7" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="127" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#1a3a52">Encuestas internas</text>
  <text x="127" y="159" text-anchor="middle" font-size="10.5" fill="#4a6f8f">Archivo CSV</text>
  <text x="127" y="177" text-anchor="middle" font-size="9.5" fill="#7b8fa1">surveys_part1.csv</text>

  <rect x="40" y="220" width="175" height="76" rx="6" fill="#e8f0f7" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="127" y="243" text-anchor="middle" font-size="12" font-weight="600" fill="#1a3a52">Reseñas web</text>
  <text x="127" y="261" text-anchor="middle" font-size="10.5" fill="#4a6f8f">BD relacional · SQL Server</text>
  <text x="127" y="279" text-anchor="middle" font-size="9.5" fill="#7b8fa1">SistemaOpiniones_Origen</text>

  <rect x="40" y="322" width="175" height="76" rx="6" fill="#e8f0f7" stroke="#2c5f8a" stroke-width="1.5"/>
  <text x="127" y="345" text-anchor="middle" font-size="12" font-weight="600" fill="#1a3a52">Comentarios sociales</text>
  <text x="127" y="363" text-anchor="middle" font-size="10.5" fill="#4a6f8f">API REST</text>
  <text x="127" y="381" text-anchor="middle" font-size="9.5" fill="#7b8fa1">JSON paginado</text>

  <!-- ══════════ Grupo: Worker Service ══════════ -->
  <rect x="280" y="80" width="400" height="470" rx="8" fill="#fbfcfd" stroke="#2c5f8a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="480" y="102" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5f8a">Servicio ETL — Worker Service (.NET 8)</text>

  <rect x="303" y="115" width="354" height="46" rx="6" fill="#2c5f8a"/>
  <text x="480" y="133" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">Worker : BackgroundService</text>
  <text x="480" y="150" text-anchor="middle" font-size="9.5" fill="#c9dcea">corrida única o cíclica · apagado ordenado</text>

  <rect x="303" y="177" width="354" height="46" rx="6" fill="#4a6f8f"/>
  <text x="480" y="195" text-anchor="middle" font-size="12" font-weight="600" fill="#ffffff">ExtractionOrchestrator</text>
  <text x="480" y="212" text-anchor="middle" font-size="9.5" fill="#d6e4ee">Task.WhenAll · Stopwatch · aislamiento de fallos</text>

  <rect x="296" y="243" width="368" height="188" rx="6" fill="#eef4f9" stroke="#8fa5b8" stroke-dasharray="4 3"/>
  <text x="480" y="261" text-anchor="middle" font-size="11.5" font-weight="600" font-style="italic" fill="#2c5f8a">interface IExtractor</text>

  <rect x="312" y="272" width="336" height="44" rx="5" fill="#ffffff" stroke="#2c5f8a"/>
  <text x="326" y="291" font-size="11.5" font-weight="600" fill="#1a3a52">CsvExtractor</text>
  <text x="326" y="307" font-size="9.5" fill="#7b8fa1">CsvHelper · validación tolerante por fila</text>

  <rect x="312" y="324" width="336" height="44" rx="5" fill="#ffffff" stroke="#2c5f8a"/>
  <text x="326" y="343" font-size="11.5" font-weight="600" fill="#1a3a52">DatabaseExtractor</text>
  <text x="326" y="359" font-size="9.5" fill="#7b8fa1">Microsoft.Data.SqlClient · DataReader en streaming</text>

  <rect x="312" y="376" width="336" height="44" rx="5" fill="#ffffff" stroke="#2c5f8a"/>
  <text x="326" y="395" font-size="11.5" font-weight="600" fill="#1a3a52">ApiExtractor</text>
  <text x="326" y="411" font-size="9.5" fill="#7b8fa1">IHttpClientFactory · paginación · reintentos</text>

  <rect x="303" y="452" width="354" height="46" rx="6" fill="#4a6f8f"/>
  <text x="480" y="470" text-anchor="middle" font-size="12" font-weight="600" font-style="italic" fill="#ffffff">interface IStagingWriter</text>
  <text x="480" y="487" text-anchor="middle" font-size="9.5" fill="#d6e4ee">el destino se elige por configuración</text>

  <text x="480" y="521" text-anchor="middle" font-size="10" fill="#7b8fa1">Los registros fluyen como IAsyncEnumerable&lt;RawOpinion&gt;: memoria constante</text>
  <text x="480" y="537" text-anchor="middle" font-size="10" fill="#7b8fa1">sin importar el volumen de la fuente.</text>

  <!-- ══════════ Grupo: Staging ══════════ -->
  <rect x="725" y="330" width="205" height="200" rx="8" fill="#f7fafc" stroke="#b8c7d4" stroke-dasharray="5 3"/>
  <text x="827" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5f8a">Staging</text>
  <text x="827" y="368" text-anchor="middle" font-size="9.5" fill="#7b8fa1">zona de aterrizaje · dato crudo</text>

  <rect x="745" y="382" width="165" height="62" rx="6" fill="#fff6e5" stroke="#c98b23" stroke-width="1.5"/>
  <text x="827" y="404" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a5410">Archivos NDJSON</text>
  <text x="827" y="421" text-anchor="middle" font-size="9.5" fill="#a8802f">output/staging/{lote}/</text>
  <text x="827" y="436" text-anchor="middle" font-size="9" fill="#a8802f">FileStagingWriter</text>

  <rect x="745" y="456" width="165" height="58" rx="6" fill="#fff6e5" stroke="#c98b23" stroke-width="1.5"/>
  <text x="827" y="477" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7a5410">dbo.Stg_Opinion</text>
  <text x="827" y="493" text-anchor="middle" font-size="9.5" fill="#a8802f">SqlBulkCopy por lotes</text>
  <text x="827" y="507" text-anchor="middle" font-size="9" fill="#a8802f">SqlStagingWriter</text>

  <!-- ══════════ Grupo: Destino analítico ══════════ -->
  <rect x="965" y="330" width="195" height="200" rx="8" fill="#f7fafc" stroke="#b8c7d4" stroke-dasharray="5 3"/>
  <text x="1062" y="352" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2c5f8a">Destino analítico</text>
  <text x="1062" y="368" text-anchor="middle" font-size="9.5" fill="#7b8fa1">fuera del alcance de esta fase</text>

  <rect x="985" y="382" width="155" height="62" rx="6" fill="#e9f4ec" stroke="#3f7d54" stroke-width="1.5"/>
  <text x="1062" y="404" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f4b2f">BD analítica</text>
  <text x="1062" y="421" text-anchor="middle" font-size="9.5" fill="#4a8560">modelo en estrella</text>
  <text x="1062" y="436" text-anchor="middle" font-size="9" fill="#4a8560">SistemaOpiniones_Analitica</text>

  <rect x="985" y="456" width="155" height="58" rx="6" fill="#e9f4ec" stroke="#3f7d54" stroke-width="1.5"/>
  <text x="1062" y="480" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1f4b2f">Dashboard</text>
  <text x="1062" y="497" text-anchor="middle" font-size="9.5" fill="#4a8560">visualización de indicadores</text>

  <!-- ══════════ Transversales ══════════ -->
  <rect x="280" y="588" width="192" height="58" rx="6" fill="#f2f2f5" stroke="#9a9aa8" stroke-width="1.3"/>
  <text x="376" y="609" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a3a44">Configuración</text>
  <text x="376" y="625" text-anchor="middle" font-size="9.5" fill="#6a6a78">appsettings.json</text>
  <text x="376" y="639" text-anchor="middle" font-size="9.5" fill="#6a6a78">User Secrets · variables de entorno</text>

  <rect x="488" y="588" width="192" height="58" rx="6" fill="#f2f2f5" stroke="#9a9aa8" stroke-width="1.3"/>
  <text x="584" y="609" text-anchor="middle" font-size="11.5" font-weight="600" fill="#3a3a44">Logging y métricas</text>
  <text x="584" y="625" text-anchor="middle" font-size="9.5" fill="#6a6a78">ILogger + Serilog</text>
  <text x="584" y="639" text-anchor="middle" font-size="9.5" fill="#6a6a78">consola · archivo diario</text>

  <!-- ══════════ Conexiones fuente → extractor ══════════ -->
  <path d="M 215 156 L 258 156 L 258 294 L 312 294" fill="none" stroke="#4a6f8f" stroke-width="1.6" marker-end="url(#flecha)"/>
  <path d="M 215 258 L 268 258 L 268 346 L 312 346" fill="none" stroke="#4a6f8f" stroke-width="1.6" marker-end="url(#flecha)"/>
  <path d="M 215 360 L 258 360 L 258 398 L 312 398" fill="none" stroke="#4a6f8f" stroke-width="1.6" marker-end="url(#flecha)"/>

  <!-- Worker → Orquestador → Extractores → StagingWriter -->
  <path d="M 480 161 L 480 177" fill="none" stroke="#4a6f8f" stroke-width="1.6" marker-end="url(#flecha)"/>
  <path d="M 480 223 L 480 243" fill="none" stroke="#4a6f8f" stroke-width="1.6" marker-end="url(#flecha)"/>
  <path d="M 480 431 L 480 452" fill="none" stroke="#4a6f8f" stroke-width="1.6" marker-end="url(#flecha)"/>

  <!-- StagingWriter → staging -->
  <path d="M 657 475 L 692 475 L 692 413 L 745 413" fill="none" stroke="#c98b23" stroke-width="1.6" marker-end="url(#flecha)"/>
  <path d="M 657 475 L 692 475 L 692 485 L 745 485" fill="none" stroke="#c98b23" stroke-width="1.6" marker-end="url(#flecha)"/>

  <!-- staging → BD analítica (fase T+L, punteada) -->
  <path d="M 910 413 L 985 413" fill="none" stroke="#8fa5b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flechaTenue)"/>
  <path d="M 910 485 L 948 485 L 948 425 L 985 425" fill="none" stroke="#8fa5b8" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#flechaTenue)"/>
  <text x="947" y="399" text-anchor="middle" font-size="9" fill="#7b8fa1">fases T + L</text>

  <!-- BD → Dashboard -->
  <path d="M 1062 444 L 1062 456" fill="none" stroke="#3f7d54" stroke-width="1.6" marker-end="url(#flecha)"/>

  <!-- Transversales → Worker -->
  <path d="M 376 588 L 376 550" fill="none" stroke="#9a9aa8" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#flechaTenue)"/>
  <path d="M 584 588 L 584 550" fill="none" stroke="#9a9aa8" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#flechaTenue)"/>

</svg>
